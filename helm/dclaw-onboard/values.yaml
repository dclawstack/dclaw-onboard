replicaCount: 1

frontend:
  image:
    repository: dclaw-onboard-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3043
  ingress:
    enabled: false

backend:
  image:
    repository: dclaw-onboard-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8129
  env:
    ONBOARD_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/dclaw_onboard"

database:
  name: dclaw_onboard
